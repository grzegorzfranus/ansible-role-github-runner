---
# =============================================================================
# GitHub Actions Workflow: Release Automation & Galaxy Publishing
# =============================================================================
name: Release

run-name: "Release [${{ github.ref_name }}]"

"on":
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Release Please Automation
  # ---------------------------------------------------------------------------
  release-please:
    name: "🤖 Release Please"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: "📦 Run Release Please Action"
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ---------------------------------------------------------------------------
  # Job 2: Validate Release PR Integrity
  # ---------------------------------------------------------------------------
  validate-release-pr:
    name: "🔍 Validate Release PR"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    steps:
      - name: "🔍 Retrieve Release PR Details"
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          PR_NUMBER=$(gh pr list \
            --repo "$REPO" \
            --head "release-please--branches--main" \
            --json number \
            --jq '.[0].number')
          PR_SHA=$(gh pr view "$PR_NUMBER" \
            --repo "$REPO" \
            --json headRefOid \
            --jq '.headRefOid')
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "sha=$PR_SHA" >> "$GITHUB_OUTPUT"

      - name: "📥 Checkout Release PR Branch"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: release-please--branches--main
          persist-credentials: false

      - name: "🧹 Run YAML Linting"
        run: pipx run yamllint .

      - name: "⚙️ Run Actionlint Validation"
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: "🌌 Validate Galaxy metadata (meta/main.yml)"
        run: |
          if [ ! -f meta/main.yml ]; then
            echo "::error::meta/main.yml is missing"
            exit 1
          fi
          python3 -c "
          import yaml, sys
          with open('meta/main.yml') as f:
              data = yaml.safe_load(f)
          gi = data.get('galaxy_info', {})
          errors = []
          for field in ['author', 'description', 'license', 'min_ansible_version']:
              if not gi.get(field):
                  errors.append(f'Missing required field: galaxy_info.{field}')
          desc = gi.get('description', '')
          if desc and len(desc) > 255:
              errors.append(f'Description too long: {len(desc)}/255 chars')
          if not gi.get('platforms'):
              errors.append('No platforms defined in galaxy_info')
          if errors:
              for e in errors:
                  print(f'::error::{e}')
              sys.exit(1)
          print('Galaxy metadata validation passed')
          "

      - name: "🚦 Publish Merge Check Status"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$PR_SHA" \
            -f state=success \
            -f context="Merge Check Gate" \
            -f description="All validations passed (Release PR)"
          echo "Set 'Merge Check' status on commit $PR_SHA"

  # ---------------------------------------------------------------------------
  # Job 3: Publish Role to Ansible Galaxy
  # ---------------------------------------------------------------------------
  publish-to-galaxy:
    name: "🚀 Publish to Ansible Galaxy"
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: grzegorzfranus/github-workflows/.github/workflows/ansible-publish.yml@main
    secrets:
      galaxy-api-key: ${{ secrets.GALAXY_API_KEY }}
