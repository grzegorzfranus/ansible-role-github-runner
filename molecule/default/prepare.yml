---
# =============================================================================
# Ansible Role: GitHub Runner - Molecule Preparation Playbook
# =============================================================================
# This playbook prepares the Molecule Docker container environment before the
# role itself is tested. It simulates prerequisites that would normally exist
# on a real server.
#
# Flow:
#   1. Fix /etc/shadow permissions for the container environment
#   2. Ensure essential directories exist
#   3. Update package caches and install basic test dependencies
#   4. Start and prepare mock rsyslog service
#   5. Wait for systemd to settle
#   6. Create target test directories and mock GitHub API responses
#   7. Install a running unit under a differently cased organization name, whose
#      KillMode=process leaves a child behind on stop, and an unrelated organization's unit
# =============================================================================

- name: Molecule | Prepare
  hosts: all
  gather_facts: true

  tasks:
    - name: Prepare | Fix /etc/shadow permissions
      become: true
      register: etc_shadow
      ansible.builtin.shell:
        cmd: |
          echo "Checking /etc/shadow permissions..."
          ls -l /etc/shadow
          chmod 0400 /etc/shadow
          echo "Fixed /etc/shadow permissions:"
          ls -l /etc/shadow
        executable: /bin/bash
      changed_when: true

    - name: Prepare | Verify shadow file permissions
      ansible.builtin.debug:
        var: etc_shadow.stdout

    - name: Prepare | Ensure required directories exist
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
        owner: root
        group: root
      loop:
        - /usr/share/keyrings
        - /etc/apt/sources.list.d
        - /etc/rsyslog.d
        - /var/log
        - /opt
      when: >
        ansible_facts['os_family'] == "Debian"

    - name: Prepare | Update apt cache
      become: true
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      changed_when: false
      when: >
        ansible_facts['os_family'] == "Debian"

    - name: Prepare | Install basic testing dependencies
      become: true
      ansible.builtin.package:
        name:
          - curl
          - wget
          - tar
          - gzip
          - sudo
          - git
          - rsyslog
          - logrotate
        state: present

    - name: Prepare | Start rsyslog service
      become: true
      ansible.builtin.service:
        name: rsyslog
        state: started
        enabled: true
      when: >
        ansible_facts['service_mgr'] == 'systemd'

    - name: Prepare | Wait for systemd to complete initialization
      become: true
      ansible.builtin.systemd:
        name: multi-user.target
        state: started
      register: systemctl_status
      until: true
      retries: 30
      delay: 5
      when: >
        ansible_facts['service_mgr'] == 'systemd'
      changed_when: false
      failed_when: false

    - name: Prepare | Create test directories for GitHub Runner
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
        owner: root
        group: root
      loop:
        - /var/log/github-runner-test
        - /opt/actions-runner-test
        - /home/test-runner

    - name: Prepare | Mock GitHub API responses (create fake endpoints)
      become: true
      ansible.builtin.copy:
        content: |
          {
            "id": 123456,
            "name": "test-runner",
            "os": "linux",
            "status": "online",
            "busy": false
          }
        dest: /tmp/mock-github-api-response.json
        mode: '0644'

    # Mirrors a host first deployed with "TEST-ORG" and later with "test-org": the role must
    # remove this unit and the orphan its stop leaves, and keep the other organization's unit.
    - name: Prepare | Install a stale runner unit under a differently cased organization
      become: true
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Stale runner unit (molecule)

          [Service]
          Type=simple
          ExecStart=/bin/bash -c "(exec -a stale-listener-probe sleep infinity) & exec sleep infinity"
          KillMode=process
          Restart=always

          [Install]
          WantedBy=multi-user.target
        dest: "/etc/systemd/system/actions.runner.TEST-ORG.test-runner-{{ ansible_facts['hostname'] }}.service"
        owner: root
        group: root
        mode: '0644'
      when: >
        ansible_facts['service_mgr'] == 'systemd'

    - name: Prepare | Create a drop-in directory for the stale runner unit
      become: true
      ansible.builtin.file:
        path: "/etc/systemd/system/actions.runner.TEST-ORG.test-runner-{{ ansible_facts['hostname'] }}.service.d"
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: >
        ansible_facts['service_mgr'] == 'systemd'

    - name: Prepare | Create a drop-in for the stale runner unit
      become: true
      ansible.builtin.copy:
        content: |
          [Service]
          TasksMax=64
        dest: "/etc/systemd/system/actions.runner.TEST-ORG.test-runner-{{ ansible_facts['hostname'] }}.service.d/override.conf"
        owner: root
        group: root
        mode: '0644'
      when: >
        ansible_facts['service_mgr'] == 'systemd'

    - name: Prepare | Install a runner unit that belongs to another organization
      become: true
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Runner unit of another organization (molecule)

          [Service]
          Type=simple
          ExecStart=/bin/true
        dest: "/etc/systemd/system/actions.runner.other-org.test-runner-{{ ansible_facts['hostname'] }}.service"
        owner: root
        group: root
        mode: '0644'
      when: >
        ansible_facts['service_mgr'] == 'systemd'

    - name: Prepare | Start the stale runner unit
      become: true
      ansible.builtin.systemd:
        name: "actions.runner.TEST-ORG.test-runner-{{ ansible_facts['hostname'] }}.service"
        state: started
        enabled: true
        daemon_reload: true
      when: >
        ansible_facts['service_mgr'] == 'systemd'

    - name: Prepare | Display preparation summary
      ansible.builtin.debug:
        msg:
          - "Molecule preparation completed"
          - "Basic dependencies: Installed"
          - "Test directories: Created"
          - "RSyslog service: Started"
