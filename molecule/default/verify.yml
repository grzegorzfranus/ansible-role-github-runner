---
# =============================================================================
# Ansible Role: GitHub Runner - Molecule Verification Playbook
# =============================================================================
# This playbook validates that the GitHub Runner role executed correctly by
# asserting the state of the system against expected outcomes.
#
# Flow:
#   1. Validate user and group creation
#   2. Validate directory structure and permissions
#   3. Assert RSyslog and logrotate configurations contain proper rules
#   4. Validate required package dependencies
#   5. Test service state (RSyslog running)
#   6. Verify systemd template processing and daemon-reload
#   7. Verify pre-job workspace reset helper, hook, and sudoers
# =============================================================================

- name: Molecule | Verify Role
  hosts: all
  gather_facts: true

  vars_files:
    - ../../defaults/main.yml
    - ../../vars/main.yml

  tasks:
    # ==========================================================================
    # User and Group Verification
    # ==========================================================================

    - name: Verify | Check if GitHub Runner user exists
      ansible.builtin.user:
        name: "test-runner"
      register: _user_check_
      failed_when: false

    - name: Verify | Assert GitHub Runner user is created
      ansible.builtin.assert:
        that:
          - _user_check_.name == "test-runner"
          - _user_check_.home == "/home/test-runner"
          - _user_check_.shell == "/bin/bash"
        fail_msg: "GitHub Runner user is not created correctly"
        success_msg: "GitHub Runner user verification passed"

    - name: Verify | Check if GitHub Runner group exists
      ansible.builtin.group:
        name: "test-runner"
      register: _group_check_
      failed_when: false

    - name: Verify | Assert GitHub Runner group is created
      ansible.builtin.assert:
        that:
          - _group_check_.name == "test-runner"
        fail_msg: "GitHub Runner group is not created correctly"
        success_msg: "GitHub Runner group verification passed"

    # ==========================================================================
    # Directory Structure Verification
    # ==========================================================================

    - name: Verify | Check installation directory exists
      ansible.builtin.stat:
        path: "/opt/actions-runner-test"
      register: _install_dir_

    - name: Verify | Assert installation directory exists
      ansible.builtin.assert:
        that:
          - _install_dir_.stat.exists
          - _install_dir_.stat.isdir
        fail_msg: "GitHub Runner installation directory not found"
        success_msg: "Installation directory verification passed"

    - name: Verify | Check log directory exists
      ansible.builtin.stat:
        path: "/var/log/github-runner-test"
      register: _log_dir_

    - name: Verify | Assert log directory exists
      ansible.builtin.assert:
        that:
          - _log_dir_.stat.exists
          - _log_dir_.stat.isdir
        fail_msg: "GitHub Runner log directory not found"
        success_msg: "Log directory verification passed"

    # ==========================================================================
    # RSyslog Configuration Verification
    # ==========================================================================

    - name: Verify | Check RSyslog configuration file exists
      ansible.builtin.stat:
        path: "/etc/rsyslog.d/49-github-runner.conf"
      register: _rsyslog_config_

    - name: Verify | Assert RSyslog configuration exists
      ansible.builtin.assert:
        that:
          - _rsyslog_config_.stat.exists
        fail_msg: "RSyslog configuration file not found"
        success_msg: "RSyslog configuration verification passed"

    - name: Verify | Check RSyslog configuration content
      ansible.builtin.slurp:
        src: "/etc/rsyslog.d/49-github-runner.conf"
      register: _rsyslog_content_

    - name: Verify | Assert RSyslog configuration contains GitHub Runner rules
      ansible.builtin.assert:
        that:
          - "'github-runner' in (_rsyslog_content_.content | b64decode)"
          - "'/var/log/github-runner-test' in (_rsyslog_content_.content | b64decode)"
        fail_msg: "RSyslog configuration does not contain proper GitHub Runner rules"
        success_msg: "RSyslog configuration content verification passed"

    # ==========================================================================
    # Logrotate Configuration Verification
    # ==========================================================================

    - name: Verify | Check logrotate configuration file exists
      ansible.builtin.stat:
        path: "/etc/logrotate.d/github-runner"
      register: _logrotate_config_

    - name: Verify | Assert logrotate configuration exists
      ansible.builtin.assert:
        that:
          - _logrotate_config_.stat.exists
        fail_msg: "Logrotate configuration file not found"
        success_msg: "Logrotate configuration verification passed"

    - name: Verify | Check logrotate configuration content
      ansible.builtin.slurp:
        src: "/etc/logrotate.d/github-runner"
      register: _logrotate_content_

    - name: Verify | Assert logrotate configuration contains proper rules
      ansible.builtin.assert:
        that:
          - "'/var/log/github-runner-test' in (_logrotate_content_.content | b64decode)"
          - "'daily' in (_logrotate_content_.content | b64decode)"
        fail_msg: "Logrotate configuration does not contain proper rules"
        success_msg: "Logrotate configuration content verification passed"

    # ==========================================================================
    # Package Dependencies Verification
    # ==========================================================================

    - name: Verify | Check if required packages are installed
      ansible.builtin.package_facts:
        manager: auto

    - name: Verify | Assert required packages are installed
      ansible.builtin.assert:
        that:
          - "'curl' in ansible_facts.packages"
          - "'wget' in ansible_facts.packages"
          - "'git' in ansible_facts.packages"
          - "'sudo' in ansible_facts.packages"
        fail_msg: "Required packages are not installed"
        success_msg: "Required packages verification passed"

    # ==========================================================================
    # Service Configuration Verification
    # ==========================================================================

    - name: Verify | Check if RSyslog service is running
      ansible.builtin.service_facts:

    - name: Verify | Assert RSyslog service is active
      ansible.builtin.assert:
        that:
          - "ansible_facts.services['rsyslog.service'].state == 'running'"
        fail_msg: "RSyslog service is not running"
        success_msg: "RSyslog service verification passed"
      when: >
        ansible_facts['service_mgr'] == 'systemd'

    - name: Verify | Read the runner environment file
      ansible.builtin.slurp:
        src: "/opt/actions-runner-test/.env"
      register: _runner_env_
      become: true

    - name: Verify | Assert job hooks use the variable names the runner reads
      ansible.builtin.assert:
        that:
          - "'ACTIONS_RUNNER_HOOK_JOB_STARTED=/usr/local/libexec/github-runner/test-runner-job-started.sh' in (_runner_env_.content | b64decode)"
          - "'ACTIONS_RUNNER_HOOK_JOB_COMPLETED=/usr/local/bin/post-job-hook.sh' in (_runner_env_.content | b64decode)"
          # The runner parses .env itself and keeps everything after the first '=' verbatim,
          # so a quoted value would reach the worker with the quote characters attached.
          - "'ACTIONS_RUNNER_HOOK_JOB_STARTED=\"' not in (_runner_env_.content | b64decode)"
          - "'RUNNER_PRE_JOB_HOOK' not in (_runner_env_.content | b64decode)"
          - "'RUNNER_POST_JOB_HOOK' not in (_runner_env_.content | b64decode)"
        fail_msg: "Job hooks do not use the variable names the runner reads"
        success_msg: "Job hooks verification passed"

    # ==========================================================================
    # Pre-job Workspace Reset Verification
    # ==========================================================================

    - name: Verify | Stat workspace reset files
      become: true
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "/usr/local/libexec/github-runner/test-runner-reset-work"
        - "/usr/local/libexec/github-runner/test-runner-job-started.sh"
        - "/etc/sudoers.d/test-runner-workspace-reset"
      register: _reset_files_

    - name: Verify | Assert workspace reset files exist with correct ownership and mode
      become: true
      ansible.builtin.assert:
        that:
          - _reset_files_.results[0].stat.exists
          - _reset_files_.results[0].stat.pw_name == "root"
          - _reset_files_.results[0].stat.gr_name == "root"
          - _reset_files_.results[0].stat.mode == "0755"
          - _reset_files_.results[1].stat.exists
          - _reset_files_.results[1].stat.pw_name == "root"
          - _reset_files_.results[1].stat.gr_name == "root"
          - _reset_files_.results[1].stat.mode == "0755"
          - _reset_files_.results[2].stat.exists
          - _reset_files_.results[2].stat.pw_name == "root"
          - _reset_files_.results[2].stat.gr_name == "root"
          - _reset_files_.results[2].stat.mode == "0440"
        fail_msg: "Workspace reset files do not exist or have incorrect ownership/mode"
        success_msg: "Workspace reset files exist with correct ownership and mode"

    - name: Verify | Validate workspace reset sudoers syntax
      become: true
      ansible.builtin.command: "/usr/sbin/visudo -cf /etc/sudoers.d/test-runner-workspace-reset"
      changed_when: false
      register: _visudo_check_

    - name: Verify | Assert workspace reset sudoers syntax is valid
      become: true
      ansible.builtin.assert:
        that:
          - _visudo_check_.rc == 0
        fail_msg: "Workspace reset sudoers syntax validation failed"
        success_msg: "Workspace reset sudoers syntax is valid"

    - name: Verify | Read workspace reset job-started hook script
      become: true
      ansible.builtin.slurp:
        src: "/usr/local/libexec/github-runner/test-runner-job-started.sh"
      register: _reset_hook_content_

    - name: Verify | Assert job-started hook script content
      become: true
      ansible.builtin.assert:
        that:
          - "'sudo -n /usr/local/libexec/github-runner/test-runner-reset-work' in (_reset_hook_content_.content | b64decode)"
          - "'/usr/local/bin/pre-job-hook.sh' in (_reset_hook_content_.content | b64decode)"
        fail_msg: "Job-started hook script does not contain expected commands"
        success_msg: "Job-started hook script content verified successfully"

    - name: Verify | Create root-owned probe directory in work dir
      become: true
      ansible.builtin.file:
        path: "/opt/actions-runner-test/_work/probe"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Verify | Create root-owned probe file in work dir
      become: true
      ansible.builtin.copy:
        content: "probe"
        dest: "/opt/actions-runner-test/_work/probe/root-owned"
        owner: root
        group: root
        mode: "0644"

    - name: Verify | Run workspace reset helper as test-runner via sudo
      become: true
      ansible.builtin.command: "runuser -u test-runner -- /usr/bin/sudo -n /usr/local/libexec/github-runner/test-runner-reset-work"
      changed_when: false
      register: _reset_helper_run_

    - name: Verify | Stat probe file after reset helper execution
      become: true
      ansible.builtin.stat:
        path: "/opt/actions-runner-test/_work/probe/root-owned"
      register: _probe_file_stat_

    - name: Verify | Assert workspace reset helper executed successfully and transferred ownership
      become: true
      ansible.builtin.assert:
        that:
          - _reset_helper_run_.rc == 0
          - _probe_file_stat_.stat.pw_name == "test-runner"
        fail_msg: "Workspace reset helper failed or file ownership was not transferred to test-runner"
        success_msg: "Workspace reset helper succeeded and transferred ownership to test-runner"

    - name: Verify | Run workspace reset helper with unexpected argument via sudo
      become: true
      ansible.builtin.command: "runuser -u test-runner -- /usr/bin/sudo -n /usr/local/libexec/github-runner/test-runner-reset-work unexpected-argument"
      changed_when: false
      failed_when: false
      register: _reset_helper_arg_run_

    - name: Verify | Assert sudo refuses helper when argument is passed
      become: true
      ansible.builtin.assert:
        that:
          - _reset_helper_arg_run_.rc != 0
        fail_msg: "sudo must refuse the helper when an argument is passed"
        success_msg: "sudo correctly refused the helper when an argument was passed"

    - name: Verify | Move work directory to work.real
      become: true
      ansible.builtin.command: "mv /opt/actions-runner-test/_work /opt/actions-runner-test/_work.real"
      changed_when: false

    - name: Verify | Create reset-target directory owned by root
      become: true
      ansible.builtin.file:
        path: "/tmp/reset-target"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Verify | Create symlink pointing to reset target
      become: true
      ansible.builtin.file:
        src: "/tmp/reset-target"
        dest: "/opt/actions-runner-test/_work"
        state: link
        owner: root
        group: root

    - name: Verify | Run reset helper directly on symlinked work directory
      become: true
      ansible.builtin.command: "/usr/local/libexec/github-runner/test-runner-reset-work"
      changed_when: false
      failed_when: false
      register: _symlink_refusal_run_

    - name: Verify | Assert reset helper failed with rc 1 on symlink
      become: true
      ansible.builtin.assert:
        that:
          - _symlink_refusal_run_.rc == 1
        fail_msg: "Helper did not refuse symlinked work directory with exit code 1"
        success_msg: "Helper correctly refused symlinked work directory with exit code 1"

    - name: Verify | Stat symlink target directory
      become: true
      ansible.builtin.stat:
        path: "/tmp/reset-target"
      register: _reset_target_stat_

    - name: Verify | Assert symlink target ownership remained root
      become: true
      ansible.builtin.assert:
        that:
          - _reset_target_stat_.stat.pw_name == "root"
        fail_msg: "Symlink target ownership was modified unexpectedly"
        success_msg: "Symlink target ownership remained root"

    - name: Verify | Remove symlink
      become: true
      ansible.builtin.file:
        path: "/opt/actions-runner-test/_work"
        state: absent

    - name: Verify | Restore work directory from work.real
      become: true
      ansible.builtin.command: "mv /opt/actions-runner-test/_work.real /opt/actions-runner-test/_work"
      changed_when: false

    - name: Verify | Clean up temporary reset target directory
      become: true
      ansible.builtin.file:
        path: "/tmp/reset-target"
        state: absent

    # ==========================================================================
    # File Permissions Verification
    # ==========================================================================

    - name: Verify | Check installation directory permissions
      ansible.builtin.stat:
        path: "/opt/actions-runner-test"
      register: _install_perms_

    - name: Verify | Assert installation directory has correct permissions
      ansible.builtin.assert:
        that:
          - _install_perms_.stat.mode == "0755"
        fail_msg: "Installation directory permissions are incorrect"
        success_msg: "Installation directory permissions verification passed"

    - name: Verify | Check log directory permissions
      ansible.builtin.stat:
        path: "/var/log/github-runner-test"
      register: _log_perms_

    - name: Verify | Assert log directory has correct permissions
      ansible.builtin.assert:
        that:
          - _log_perms_.stat.mode == "0755"
        fail_msg: "Log directory permissions are incorrect"
        success_msg: "Log directory permissions verification passed"

    # ==========================================================================
    # Handler Verification
    # ==========================================================================

    - name: Verify | Test systemd daemon reload capability
      ansible.builtin.command: "systemctl daemon-reload"
      become: true
      changed_when: false

    - name: Verify | Assert systemd daemon reload works
      ansible.builtin.debug:
        msg: "Systemd daemon reload capability verified"

    # ==========================================================================
    # Configuration File Templates Verification
    # ==========================================================================

    - name: Verify | Check if configuration templates were processed correctly
      ansible.builtin.find:
        paths: "/etc/rsyslog.d"
        patterns: "*github-runner*"
      register: _template_files_

    - name: Verify | Assert configuration templates exist
      ansible.builtin.assert:
        that:
          - _template_files_.files | length > 0
        fail_msg: "Configuration template files not found"
        success_msg: "Configuration template verification passed"

    - name: Verify | Stat scheduled cleanup artifacts
      become: true
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/local/libexec/github-runner/test-runner-cleanup
        - /etc/systemd/system/test-runner-cleanup.service
        - /etc/systemd/system/test-runner-cleanup.timer
        - /etc/tmpfiles.d/test-runner-cleanup.conf
        - /run/github-runner/test-runner.lock
      register: _cleanup_artifacts_

    - name: Verify | Assert scheduled cleanup artifacts exist
      ansible.builtin.assert:
        that:
          - _cleanup_artifacts_.results | map(attribute='stat.exists') | select | list | length == 5
          - _cleanup_artifacts_.results[0].stat.mode == '0750'
          - _cleanup_artifacts_.results[0].stat.pw_name == 'root'
        fail_msg: "Scheduled cleanup artifacts are missing or the helper has the wrong owner or mode"
        success_msg: "Scheduled cleanup artifacts are in place"

    - name: Verify | Read job-started hook for the cleanup gate
      become: true
      ansible.builtin.slurp:
        src: /usr/local/libexec/github-runner/test-runner-job-started.sh
      register: _cleanup_hook_

    - name: Verify | Assert job-started hook waits on the cleanup lock
      ansible.builtin.assert:
        that:
          - "'flock --exclusive --wait 5 9' in (_cleanup_hook_.content | b64decode)"
          - "'/run/github-runner/test-runner.lock' in (_cleanup_hook_.content | b64decode)"
        fail_msg: "Job-started hook does not wait on the cleanup lock"
        success_msg: "Job-started hook waits on the cleanup lock"

    - name: Verify | Create cleanup fixtures
      become: true
      ansible.builtin.shell: |
        set -euo pipefail
        w=/opt/actions-runner-test/_work
        mkdir -p "$w/stale-repo/stale-repo/.git" "$w/fresh-repo/fresh-repo/.git" \
          "$w/fresh-repo/fresh-repo/.cache/trivy" "$w/_tool/keep" \
          /opt/actions-runner-test/_diag /home/test-runner/.yarn/berry/cache
        touch -d '10 days ago' "$w/stale-repo/stale-repo/.git/FETCH_HEAD"
        touch "$w/fresh-repo/fresh-repo/.git/FETCH_HEAD" "$w/fresh-repo/fresh-repo/.cache/trivy/db"
        touch -d '10 days ago' "$w/_tool/keep/old"
        touch -d '20 days ago' /opt/actions-runner-test/_diag/Worker_old.log
        touch /opt/actions-runner-test/_diag/Worker_new.log
        touch /home/test-runner/.yarn/berry/cache/old.zip /home/test-runner/.yarn/berry/cache/new.zip
        touch -a -d '40 days ago' /home/test-runner/.yarn/berry/cache/old.zip
      args:
        executable: /bin/bash
      changed_when: false

    - name: Verify | Run the cleanup helper while idle
      become: true
      ansible.builtin.command: /usr/local/libexec/github-runner/test-runner-cleanup
      register: _cleanup_run_
      changed_when: false

    - name: Verify | Stat paths after the idle cleanup
      become: true
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /opt/actions-runner-test/_work/stale-repo/stale-repo
        - /opt/actions-runner-test/_work/fresh-repo/fresh-repo
        - /opt/actions-runner-test/_work/fresh-repo/fresh-repo/.cache/trivy
        - /opt/actions-runner-test/_work/_tool/keep/old
        - /opt/actions-runner-test/_diag/Worker_old.log
        - /opt/actions-runner-test/_diag/Worker_new.log
        - /home/test-runner/.yarn/berry/cache/old.zip
        - /home/test-runner/.yarn/berry/cache/new.zip
        - /opt/actions-runner-test/_work/.runner-cleanup-trash
      register: _cleanup_after_

    - name: Verify | Assert the idle cleanup removed exactly the eligible paths
      ansible.builtin.assert:
        that:
          - _cleanup_run_.rc == 0
          - not _cleanup_after_.results[0].stat.exists
          - _cleanup_after_.results[1].stat.exists
          - not _cleanup_after_.results[2].stat.exists
          - _cleanup_after_.results[3].stat.exists
          - not _cleanup_after_.results[4].stat.exists
          - _cleanup_after_.results[5].stat.exists
          - not _cleanup_after_.results[6].stat.exists
          - _cleanup_after_.results[7].stat.exists
          - not _cleanup_after_.results[8].stat.exists
        fail_msg: "Idle cleanup removed the wrong paths: {{ _cleanup_run_.stdout }}"
        success_msg: "Idle cleanup removed stale checkout, Trivy cache, old log and unused Yarn file, and kept the rest"

    - name: Verify | Recreate a stale checkout for the busy check
      become: true
      ansible.builtin.shell: |
        set -euo pipefail
        mkdir -p /opt/actions-runner-test/_work/stale-repo/stale-repo/.git
        touch -d '10 days ago' /opt/actions-runner-test/_work/stale-repo/stale-repo/.git/FETCH_HEAD
      args:
        executable: /bin/bash
      changed_when: false

    - name: Verify | Start a fake job worker as the runner account
      become: true
      ansible.builtin.shell: "runuser -u test-runner -- bash -c 'exec -a Runner.Worker sleep 60'"
      async: 60
      poll: 0
      changed_when: false

    - name: Verify | Wait for the fake worker to appear
      become: true
      ansible.builtin.command: pgrep -u test-runner -f Runner.Worker
      register: _fake_worker_
      until: _fake_worker_.rc == 0
      retries: 10
      delay: 1
      changed_when: false

    - name: Verify | Run the cleanup helper while a job is running
      become: true
      ansible.builtin.command: /usr/local/libexec/github-runner/test-runner-cleanup
      register: _cleanup_busy_
      changed_when: false

    - name: Verify | Stat the stale checkout after the busy run
      become: true
      ansible.builtin.stat:
        path: /opt/actions-runner-test/_work/stale-repo/stale-repo
      register: _cleanup_busy_stat_

    - name: Verify | Assert the cleanup skipped while a job was running
      ansible.builtin.assert:
        that:
          - _cleanup_busy_.rc == 0
          - "'skipping this run' in _cleanup_busy_.stdout"
          - _cleanup_busy_stat_.stat.exists
        fail_msg: "Cleanup did not skip while a job was running: {{ _cleanup_busy_.stdout }}"
        success_msg: "Cleanup skipped while a job was running"

    - name: Verify | Stop the fake job worker
      become: true
      ansible.builtin.command: pkill -u test-runner -f Runner.Worker
      failed_when: false
      changed_when: false

    - name: Verify | Hold the cleanup lock as a running cleanup would
      become: true
      ansible.builtin.shell: "flock --exclusive --close /run/github-runner/test-runner.lock sleep 30"
      async: 30
      poll: 0
      changed_when: false

    - name: Verify | Wait until the lock is held
      become: true
      ansible.builtin.command: flock --exclusive --nonblock /run/github-runner/test-runner.lock true
      register: _lock_probe_
      until: _lock_probe_.rc != 0
      retries: 10
      delay: 1
      failed_when: false
      changed_when: false

    - name: Verify | Run the job-started hook while the cleanup lock is held
      become: true
      ansible.builtin.command: runuser -u test-runner -- /usr/local/libexec/github-runner/test-runner-job-started.sh
      register: _gate_run_
      failed_when: false
      changed_when: false

    - name: Verify | Assert the hook waited and then failed the job
      ansible.builtin.assert:
        that:
          - _gate_run_.rc != 0
          - "'Runner cleanup still holds' in _gate_run_.stderr"
        fail_msg: "Job-started hook did not wait on the cleanup lock: rc={{ _gate_run_.rc }} {{ _gate_run_.stderr }}"
        success_msg: "Job-started hook waited on the cleanup lock and failed the job after the timeout"

    - name: Verify | Release the held cleanup lock
      become: true
      ansible.builtin.command: pkill -f 'flock --exclusive --close /run/github-runner/test-runner.lock'
      failed_when: false
      changed_when: false

    # ==========================================================================
    # Final Comprehensive Summary
    # ==========================================================================

    - name: Verify | Show comprehensive verification results
      ansible.builtin.debug:
        msg:
          - "All GitHub Runner verification checks completed successfully"
          - "User Management: Passed"
          - "Directory Structure: Passed"
          - "RSyslog Integration: Passed"
          - "Logrotate Configuration: Passed"
          - "Package Dependencies: Passed"
          - "Service Configuration: Passed"
          - "File Permissions: Passed"
          - "Template Processing: Passed"
          - "Role is ready for production use"
